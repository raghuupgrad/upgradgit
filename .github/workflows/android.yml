name: Build Billing Raghu APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # STEP 1: Find ZIP and extract automatically
      - name: Find and Extract ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for uploaded ZIP files..."

          ZIP=""

          while IFS= read -r file; do
            if unzip -l "$file" | grep -Eqi '(^|[[:space:]])index\.html$'; then
              ZIP="$file"
              break
            fi
          done < <(find . -type f -iname '*.zip' \
            -not -path './.git/*' \
            -not -path './extracted/*' | sort)

          if [ -z "$ZIP" ]; then
            echo "::error::No ZIP containing index.html found."
            echo "Files available in repository:"
            find . -maxdepth 5 -type f
            exit 1
          fi

          echo "ZIP found: $ZIP"

          mkdir -p extracted

          unzip -o "$ZIP" -d extracted

          HTML=$(find extracted -type f -iname 'index.html' | head -n 1)

          if [ -z "$HTML" ]; then
            echo "::error::index.html not found inside ZIP."
            exit 1
          fi

          echo "HTML found: $HTML"

          cp "$HTML" index.html

          echo "ZIP extraction completed."

      # STEP 2: Generate Android project
      - name: Generate Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/gundrathy/invoicemanager
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BillingRaghu"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.gundrathy.invoicemanager'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.gundrathy.invoicemanager'
                  minSdk 23
                  targetSdk 35
                  versionCode 6
                  versionName '1.5'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.13.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:label="Billing raghu"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.provider"
                      android:exported="false"
                      android:grantUriPermissions="true">

                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths"/>
                  </provider>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="shared_pdfs" path="shared/"/>
          </paths>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar"/>
          </resources>
          EOF

          cat > app/src/main/java/com/gundrathy/invoicemanager/MainActivity.java <<'EOF'
          package com.gundrathy.invoicemanager;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.core.content.FileProvider;
          import java.io.File;
          import java.io.FileOutputStream;

          public class MainActivity extends Activity {

              WebView webView;
              SharedPreferences storage;

              public class AndroidStorage {
                  @JavascriptInterface
                  public String getItem(String key) {
                      return storage.getString(key, null);
                  }

                  @JavascriptInterface
                  public void setItem(String key, String value) {
                      storage.edit().putString(key, value).commit();
                  }

                  @JavascriptInterface
                  public void removeItem(String key) {
                      storage.edit().remove(key).commit();
                  }

                  @JavascriptInterface
                  public void clear() {
                      storage.edit().clear().commit();
                  }
              }

              public class AndroidPrint {
                  @JavascriptInterface
                  public void printPage() {
                      runOnUiThread(() -> {
                          PrintManager manager =
                              (PrintManager)getSystemService(
                                  Context.PRINT_SERVICE);

                          manager.print(
                              "Billing raghu Invoice",
                              webView.createPrintDocumentAdapter(
                                  "Billing raghu Invoice"),
                              new PrintAttributes.Builder()
                                  .setMediaSize(
                                      PrintAttributes.MediaSize.ISO_A4)
                                  .build());
                      });
                  }
              }

              public class AndroidShare {
                  @JavascriptInterface
                  public void sharePdf(String data, String name) {
                      runOnUiThread(() -> {
                          try {
                              byte[] bytes =
                                  Base64.decode(data, Base64.DEFAULT);

                              File dir = new File(
                                  getCacheDir(), "shared");
                              dir.mkdirs();

                              File file = new File(
                                  dir, name.replaceAll(
                                      "[^A-Za-z0-9._-]", "_"));

                              try (FileOutputStream out =
                                  new FileOutputStream(file)) {
                                  out.write(bytes);
                              }

                              Uri uri = FileProvider.getUriForFile(
                                  MainActivity.this,
                                  getPackageName() + ".provider",
                                  file);

                              Intent send =
                                  new Intent(Intent.ACTION_SEND);

                              send.setType("application/pdf");
                              send.putExtra(Intent.EXTRA_STREAM, uri);
                              send.addFlags(
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION);

                              startActivity(Intent.createChooser(
                                  send, "Share invoice PDF"));

                          } catch (Exception e) {
                              android.widget.Toast.makeText(
                                  MainActivity.this,
                                  "PDF sharing failed",
                                  android.widget.Toast.LENGTH_LONG
                              ).show();
                          }
                      });
                  }
              }

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  storage = getSharedPreferences(
                      "billing_raghu_invoice_data",
                      MODE_PRIVATE);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  webView.addJavascriptInterface(
                      new AndroidStorage(), "AndroidStorage");

                  webView.addJavascriptInterface(
                      new AndroidPrint(), "AndroidPrint");

                  webView.addJavascriptInterface(
                      new AndroidShare(), "AndroidShare");

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                      "file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      # STEP 3: Build APK
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      # STEP 4: Download APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Billing-Raghu-APK-v1.5
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
