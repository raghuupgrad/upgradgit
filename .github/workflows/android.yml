name: Build Billing Raghu APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Uploaded ZIP Automatically
        shell: bash
        run: |
          set -e

          if [ -f index.html ]; then
            echo "HTML already available."
          else
            ZIP=""

            while IFS= read -r file; do
              if unzip -l "$file" | grep -Eq '[[:space:]]index\.html$'; then
                ZIP="$file"
                break
              fi
            done < <(find . -type f -iname '*.zip' \
              -not -path './.git/*' | sort)

            if [ -z "$ZIP" ]; then
              echo "::error::No ZIP containing index.html found."
              exit 1
            fi

            echo "Extracting $ZIP"
            mkdir -p extracted
            unzip -o "$ZIP" -d extracted

            HTML=$(find extracted -type f -name index.html | head -n 1)

            if [ -z "$HTML" ]; then
              echo "::error::index.html not found."
              exit 1
            fi

            cp "$HTML" index.html
          fi

      - name: Fix Print Button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")

          if "function printInvoice" not in html:
              html, count = re.subn(
                  r'onclick\s*=\s*(["\'])window\.print\(\)\1',
                  'onclick="printInvoice()"',
                  html,
                  count=1,
                  flags=re.I
              )

              if count == 0:
                  raise SystemExit("Print button not found.")

              helper = """
          <script>
          function printInvoice() {
              if (window.AndroidPrint &&
                  typeof window.AndroidPrint.printPage === 'function') {
                  window.AndroidPrint.printPage();
              } else {
                  window.print();
              }
          }
          </script>
          """
              html = helper + html

          p.write_text(html, encoding="utf-8")
          PY

      - name: Verify Required Features
        run: |
          grep -q 'function unlockFontControls' index.html
          grep -q 'function applyInvoiceFontSize' index.html
          grep -q 'function requestDeleteBill' index.html
          grep -q 'function requestStatusChange' index.html
          echo "Feature verification completed."

      - name: Generate Android Project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/gundrathy/invoicemanager
          mkdir -p app/src/main/res/values

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BillingRaghu"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.gundrathy.invoicemanager'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.gundrathy.invoicemanager'
                  minSdk 23
                  targetSdk 35
                  versionCode 4
                  versionName '1.3'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Billing raghu"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/gundrathy/invoicemanager/MainActivity.java <<'EOF'
          package com.gundrathy.invoicemanager;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              WebView webView;
              SharedPreferences storage;

              public class AndroidStorage {
                  @JavascriptInterface
                  public String getItem(String key) {
                      return storage.getString(key, null);
                  }

                  @JavascriptInterface
                  public void setItem(String key, String value) {
                      storage.edit().putString(key, value).commit();
                  }

                  @JavascriptInterface
                  public void removeItem(String key) {
                      storage.edit().remove(key).commit();
                  }

                  @JavascriptInterface
                  public void clear() {
                      storage.edit().clear().commit();
                  }
              }

              public class AndroidPrint {
                  @JavascriptInterface
                  public void printPage() {
                      runOnUiThread(() -> {
                          PrintManager manager =
                              (PrintManager)getSystemService(
                                  Context.PRINT_SERVICE);

                          manager.print(
                              "Billing raghu Invoice",
                              webView.createPrintDocumentAdapter(
                                  "Billing raghu Invoice"),
                              new PrintAttributes.Builder()
                                  .setMediaSize(
                                      PrintAttributes.MediaSize.ISO_A4)
                                  .setMinMargins(
                                      PrintAttributes.Margins.NO_MARGINS)
                                  .build());
                      });
                  }
              }

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  storage = getSharedPreferences(
                      "billing_raghu_invoice_data", MODE_PRIVATE);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  webView.addJavascriptInterface(
                      new AndroidStorage(), "AndroidStorage");

                  webView.addJavascriptInterface(
                      new AndroidPrint(), "AndroidPrint");

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar"/>
          </resources>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Billing-Raghu-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
